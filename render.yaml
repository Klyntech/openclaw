services:
  - type: web
    name: nallyclaw
    runtime: docker
    plan: free
    # The image CMD has no --allow-unconfigured, so a fresh ephemeral
    # filesystem with no openclaw.json exits before binding.
    dockerCommand: node openclaw.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      # Bound V8 old-space usage for the 512 MiB Render target. This is a
      # starting guardrail, not proof that total process RSS fits the limit.
      # Render exposes Docker-service env vars as build args too. Keep the
      # image limited to the providers/features Nally needs instead of bundling
      # every optional OpenClaw extension.
      - key: OPENCLAW_EXTENSIONS
        value: telegram,nvidia,memory-core,document-extract,image-generation-core,senseaudio,azure-speech,fish-audio-speech,talk-voice
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true

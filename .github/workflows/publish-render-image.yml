name: Validate Render source Docker build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-source-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'Klyntech/openclaw' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Render source without publishing an image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            OPENCLAW_DOCKER_BUILD_NODE_OPTIONS=--max-old-space-size=6144
            OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB=4352
            OPENCLAW_DOCKER_BUILD_SKIP_DTS=1
          cache-from: type=gha,scope=render-source-build
          cache-to: type=gha,mode=max,scope=render-source-build

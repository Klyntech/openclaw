name: Publish Render Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Do not publish images from a different fork if this workflow is copied.
    if: ${{ github.repository == 'Klyntech/openclaw' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the Render image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/klyntech/openclaw:sha-${{ github.sha }}
            ghcr.io/klyntech/openclaw:main
          labels: |
            org.opencontainers.image.source=https://github.com/Klyntech/openclaw
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OPENCLAW_DOCKER_BUILD_NODE_OPTIONS=--max-old-space-size=6144
            OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB=4352
            OPENCLAW_DOCKER_BUILD_SKIP_DTS=1
          cache-from: type=gha,scope=render-image
          cache-to: type=gha,mode=max,scope=render-image

      - name: Trigger Render image deploy (optional)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_TAG: ghcr.io/klyntech/openclaw:sha-${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; the image was published and can be deployed manually."
            exit 0
          fi

          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            --get \
            --data-urlencode "imgURL=${IMAGE_TAG}" \
            "${RENDER_DEPLOY_HOOK_URL}"
